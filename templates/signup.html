<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account — MindCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/global.css">
    <style>
        body {
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-lg);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .auth-logo svg {
            width: 24px;
            height: 24px;
            color: #fff;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .auth-desc {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .btn-auth {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            margin-top: 16px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }

        .role-option {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-secondary);
        }

        .role-option:hover {
            border-color: var(--accent);
        }

        .role-option.selected {
            border-color: var(--accent);
            background: var(--accent-subtle);
            color: var(--accent);
        }

        .role-option-title {
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 14A6 6 0 1 1 8 2a6 6 0 0 1 0 12z"/><path d="M8 4a1 1 0 0 0-1 1v3H5a1 1 0 0 0 0 2h2v3a1 1 0 0 0 2 0v-3h2a1 1 0 0 0 0-2H9V5a1 1 0 0 0-1-1z"/></svg>
                </div>
                <h1 class="auth-title">Create an account</h1>
                <p class="auth-desc">Join your campus mental health platform.</p>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label">I am a...</label>
                    <div class="role-selector">
                        <div class="role-option selected" data-role="student" onclick="selectRole('student', this)">
                            <div class="role-option-title">Student</div>
                        </div>
                        <div class="role-option" data-role="staff" onclick="selectRole('staff', this)">
                            <div class="role-option-title">Staff / Faculty</div>
                        </div>
                        <div class="role-option" data-role="counselor" onclick="selectRole('counselor', this)">
                            <div class="role-option-title">Counselor</div>
                        </div>
                    </div>
                    <p id="roleHint" style="font-size: 12px; color: var(--text-muted); margin-top: -4px;"></p>
                </div>

                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">University Email</label>
                    <input type="email" id="email" class="form-input" placeholder="name@university.edu" required>
                </div>
                <div class="form-group" id="institutionGroup">
                    <label class="form-label" for="institution">Institution</label>
                    <input type="text" id="institution" class="form-input" list="universities" placeholder="Type or select your university">
                    <datalist id="universities">
                        <option value="Stanford University">
                        <option value="MIT">
                        <option value="Harvard University">
                        <option value="UC Berkeley">
                        <option value="Demo University">
                    </datalist>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="Create a password" required minlength="6">
                </div>

                <div id="signupError" class="alert alert-danger" style="display: none; font-size: 12px; padding: 10px; margin-bottom: 16px;"></div>

                <button type="submit" class="btn btn-primary btn-auth" id="signupBtn">Sign up</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="/login/">Log in</a>
            </div>
            <p style="text-align:center; font-size:11px; color:var(--text-muted); margin-top:16px;">
                Platform administrator accounts are issued directly by MindCare and aren't available through self sign-up.
            </p>
        </div>
    </div>

    <script>
        let currentRole = 'student';

        const roleHints = {
            student: 'You\'ll get access to mood tracking, self-assessments, AI support, peer support, resources, and session booking.',
            staff: 'You\'ll get an institution-level wellbeing dashboard plus access to AI support, resources, and session booking.',
            counselor: 'Counselor accounts require approval from a platform admin before you can log in and accept bookings.'
        };

        function updateInstitutionRequirement(role) {
            const group = document.getElementById('institutionGroup');
            const input = document.getElementById('institution');
            if (role === 'counselor') {
                group.style.display = 'none';
                input.required = false;
                input.value = '';
            } else {
                group.style.display = '';
                input.required = true;
            }
            document.getElementById('roleHint').textContent = roleHints[role] || '';
        }

        function selectRole(role, el) {
            currentRole = role;
            document.querySelectorAll('.role-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
            updateInstitutionRequirement(role);
        }

        updateInstitutionRequirement(currentRole);

        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const institution = document.getElementById('institution').value;
            const btn = document.getElementById('signupBtn');
            const errorDiv = document.getElementById('signupError');

            btn.disabled = true;
            btn.textContent = 'Creating account...';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/signup/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        institution,
                        role: currentRole
                    })
                });

                const data = await response.json();

                if (data.success && data.pending_approval) {
                    errorDiv.className = 'alert alert-info';
                    errorDiv.style.display = 'block';
                    errorDiv.style.fontSize = '13px';
                    errorDiv.style.padding = '12px';
                    errorDiv.textContent = data.message;
                    btn.textContent = 'Pending approval';
                    document.getElementById('signupForm').querySelectorAll('input').forEach(i => i.disabled = true);
                } else if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = data.redirect_url || '/mindcare-home/';
                } else {
                    errorDiv.className = 'alert alert-danger';
                    errorDiv.textContent = data.error || 'Failed to create account';
                    errorDiv.style.display = 'block';
                    btn.disabled = false;
                    btn.textContent = 'Sign up';
                }
            } catch (err) {
                errorDiv.className = 'alert alert-danger';
                errorDiv.textContent = 'Network error. Please try again.';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Sign up';
            }
        });
    </script>
</body>
</html>
